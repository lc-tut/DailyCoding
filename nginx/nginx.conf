# ─────────────────────────────────────────────────────────────────
# nginx.conf  dailycoding.lcn.ad.jp 本番用リバースプロキシ設定
#
# 構成:
#   443 (HTTPS) ─┬─ /api/* → backend:8080   (内部ネットワーク)
#                └─ /*     → frontend:3000  (内部ネットワーク)
#    80 (HTTP)  ─── 301 HTTPS リダイレクト
#
# バックエンド・フロントエンドは Docker 内部ネットワーク上のみに存在し、
# 外部ポートを一切 publish しない。nginx が唯一の外部 entry point。
#
# TLS 証明書 (ホストにマウント):
#   /etc/nginx/certs/fullchain.pem  (証明書 + 中間証明書)
#   /etc/nginx/certs/privkey.pem    (秘密鍵)
#
# lcn.ad.jp は内部ドメインのため、内部 CA または
# Let's Encrypt DNS チャレンジで証明書を発行すること。
# ─────────────────────────────────────────────────────────────────

upstream backend {
    server backend:8080;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

# ── HTTP → HTTPS リダイレクト ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dailycoding.lcn.ad.jp;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS メイン ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2  on;
    server_name dailycoding.lcn.ad.jp;

    # TLS 証明書
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS セキュリティ設定
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS (lcn.ad.jp 内部ドメインなので preload 不要)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # セキュリティヘッダー
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "geolocation=(), camera=(), microphone=()" always;

    # リクエストボディ上限 (コード提出: 512KB で十分)
    client_max_body_size 512k;

    # ── /api/* → バックエンド ─────────────────────────────────────
    # バックエンドコンテナは外部ポートを持たず内部ネットワーク経由のみ。
    # OAuth コールバック・JWT 発行・コード実行 API はすべてここを通る。
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # コード実行は最大 30s かかることを考慮
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;

        # レスポンスのバッファリングを無効化 (Set-Cookie 等を即時転送)
        proxy_buffering off;
    }

    # ── /_next/static/* — Next.js 静的アセット (長期キャッシュ) ──
    location /_next/static/ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── /* → フロントエンド (Next.js) ────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
