# ─────────────────────────────────────────────────────────────────
# docker-compose.prod.yml  本番環境構成
#
# 外部に公開するのは nginx (80/443) のみ。
# backend・frontend・postgres はすべて内部ネットワーク。
#
# 起動前の準備:
#   1. backend/.env.prod を作成 (.env.prod.example を参考)
#   2. TLS 証明書を ./nginx/certs/ に配置
#        fullchain.pem / privkey.pem
#   3. docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────

services:

  # ── データベース ────────────────────────────────────────────────
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-daileycoding}
      POSTGRES_USER:     ${POSTGRES_USER:-daileycoding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daileycoding} -d ${POSTGRES_DB:-daileycoding}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ポートを外部に publish しない (内部アクセスのみ)

  # ── バックエンド (Go) ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env.prod
    volumes:
      # Docker コード実行エンジンがホストの Docker デーモンを使用
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    # ポートを外部に publish しない。nginx 経由のみ。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/auth/providers || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── フロントエンド (Next.js) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ブラウザから見た API の向き先。同一オリジン (nginx) を指す。
        NEXT_PUBLIC_API_BASE: https://dailycoding.lcn.ad.jp
    restart: unless-stopped
    environment:
      # サーバーサイドからバックエンドを呼ぶ際の内部 URL (rewrites 用)
      BACKEND_INTERNAL_URL: http://backend:8080
      NODE_ENV: production
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy

  # ── nginx リバースプロキシ ──────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS 証明書: ./nginx/certs/ にホスト側で配置する
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal
    depends_on:
      - frontend
      - backend

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
